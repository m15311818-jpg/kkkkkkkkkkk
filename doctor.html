<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شاشة الدكتور</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
body {
    background: linear-gradient(135deg, #0a0e27, #1a1f4a);
    color: #fff;
    min-height: 100vh;
    padding: 20px;
}
.header {
    text-align: center;
    padding: 20px;
    background: rgba(0, 220, 200, 0.1);
    border: 2px solid rgba(0, 220, 200, 0.3);
    border-radius: 20px;
    margin-bottom: 20px;
}
.header h1 {
    font-size: 40px;
    background: linear-gradient(90deg, #00dcc8, #a064ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
}
.session-info {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 15px;
    margin-top: 15px;
}
.info-box {
    background: rgba(0, 0, 0, 0.3);
    padding: 15px 25px;
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.1);
}
.info-label { font-size: 13px; color: #8892c0; margin-bottom: 5px; }
.info-value { font-size: 24px; font-weight: bold; color: #00dcc8; }
.code-display {
    font-size: 60px;
    font-weight: 900;
    letter-spacing: 10px;
    color: #ffd700;
    text-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
    font-family: 'Courier New', monospace;
}
.controls {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
}
.btn {
    padding: 15px 30px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
}
.btn-start {
    background: linear-gradient(135deg, #00dcc8, #0088ff);
    color: #fff;
    box-shadow: 0 5px 20px rgba(0, 220, 200, 0.4);
}
.btn-stop {
    background: linear-gradient(135deg, #ff5050, #ff8800);
    color: #fff;
}
.btn-export {
    background: linear-gradient(135deg, #64ff96, #00aa55);
    color: #fff;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}
.stat-card {
    background: rgba(30, 30, 55, 0.7);
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    border: 2px solid rgba(100, 120, 200, 0.3);
}
.stat-number { font-size: 36px; font-weight: 900; margin-bottom: 5px; }
.stat-label { font-size: 14px; color: #8892c0; }
.stat-present .stat-number { color: #64ff96; }
.stat-absent .stat-number { color: #ff5050; }
.stat-pending .stat-number { color: #ffd700; }

.students-container {
    background: rgba(20, 25, 55, 0.7);
    border-radius: 20px;
    padding: 20px;
    min-height: 300px;
    border: 2px solid rgba(100, 120, 200, 0.2);
}
.students-title {
    font-size: 22px;
    margin-bottom: 15px;
    color: #00dcc8;
}
.students-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
}
.student-item {
    background: rgba(10, 15, 35, 0.9);
    padding: 18px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-right: 5px solid #ffd700;
    animation: slideIn 0.4s ease-out;
    cursor: pointer;
    transition: all 0.2s;
}
.student-item:hover { transform: translateX(-5px); }
.student-item.confirmed {
    border-right-color: #64ff96;
    background: rgba(100, 255, 150, 0.1);
}
@keyframes slideIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
.student-name { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
.student-id { font-size: 14px; color: #8892c0; }
.student-status { font-size: 28px; }
.empty-message {
    text-align: center;
    color: #667;
    padding: 60px 20px;
    font-size: 18px;
}
</style>
</head>
<body>
<div class="header">
    <h1>📋 تسجيل الحضور</h1>
    <div class="session-info">
        <div class="info-box">
            <div class="info-label">📅 التاريخ</div>
            <div class="info-value" id="dateDisplay">-</div>
        </div>
        <div class="info-box">
            <div class="info-label">🕐 الوقت</div>
            <div class="info-value" id="timeDisplay">-</div>
        </div>
        <div class="info-box">
            <div class="info-label">🔑 رمز الجلسة</div>
            <div class="info-value code-display" id="sessionCode">-----</div>
        </div>
    </div>
</div>

<div class="controls">
    <button class="btn btn-start" id="startBtn" onclick="startSession()">▶ بدء جلسة جديدة</button>
    <button class="btn btn-stop" id="stopBtn" onclick="stopSession()" disabled>⏹ إغلاق الجلسة</button>
    <button class="btn btn-export" onclick="exportToCSV()">📥 تصدير Excel</button>
</div>

<div class="stats">
    <div class="stat-card stat-present">
        <div class="stat-number" id="presentCount">0</div>
        <div class="stat-label">✅ حاضر</div>
    </div>
    <div class="stat-card stat-pending">
        <div class="stat-number" id="pendingCount">0</div>
        <div class="stat-label">⏳ بانتظار التأكيد</div>
    </div>
    <div class="stat-card stat-absent">
        <div class="stat-number" id="absentCount">0</div>
        <div class="stat-label">❌ غايب</div>
    </div>
</div>

<div class="students-container">
    <h2 class="students-title">👥 الطلاب المسجلون (<span id="totalStudents">0</span>)</h2>
    <div class="students-list" id="studentsList">
        <div class="empty-message">لا يوجد طلاب مسجلون بعد</div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
    databaseURL: "https://attendance-system-ad1c2-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentSessionCode = null;
let sessionActive = false;
let studentsData = {};

// عرض التاريخ والوقت
function updateClock() {
    const now = new Date();
    document.getElementById('dateDisplay').textContent = now.toLocaleDateString('ar-EG');
    document.getElementById('timeDisplay').textContent = now.toLocaleTimeString('ar-EG');
}
setInterval(updateClock, 1000);
updateClock();

// توليد كود عشوائي
function generateCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 5; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
    }
    return code;
}

// بدء جلسة جديدة
window.startSession = async function() {
    currentSessionCode = generateCode();
    sessionActive = true;

    // مسح بيانات الجلسة السابقة
    await set(ref(db, 'currentSession'), {
        code: currentSessionCode,
        active: true,
        startTime: Date.now(),
        students: {}
    });

    document.getElementById('sessionCode').textContent = currentSessionCode;
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;

    alert(`✅ بدأت الجلسة\nرمز الجلسة: ${currentSessionCode}\n\nاعرض الشاشة على السبورة الذكية`);
};

// إغلاق الجلسة
window.stopSession = async function() {
    if (!confirm('هل تريد إغلاق الجلسة؟')) return;
    sessionActive = false;
    await update(ref(db, 'currentSession'), { active: false });
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    alert('تم إغلاق الجلسة');
};

// الاستماع للبيانات
onValue(ref(db, 'currentSession'), (snapshot) => {
    const data = snapshot.val();
    if (!data) return;

    if (data.code) {
        currentSessionCode = data.code;
        document.getElementById('sessionCode').textContent = data.code;
    }

    if (data.active) {
        sessionActive = true;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
    }

    studentsData = data.students || {};
    renderStudents();
});

// عرض الطلاب
function renderStudents() {
    const list = document.getElementById('studentsList');
    const students = Object.entries(studentsData);

    if (students.length === 0) {
        list.innerHTML = '<div class="empty-message">لا يوجد طلاب مسجلون بعد</div>';
        document.getElementById('presentCount').textContent = '0';
        document.getElementById('pendingCount').textContent = '0';
        document.getElementById('absentCount').textContent = '0';
        document.getElementById('totalStudents').textContent = '0';
        return;
    }

    let present = 0, pending = 0;

    list.innerHTML = students.map(([id, student]) => {
        const status = student.confirmed ? 'present' : 'pending';
        if (student.confirmed) present++; else pending++;

        return `
            <div class="student-item ${student.confirmed ? 'confirmed' : ''}"
                 onclick="toggleConfirm('${id}')">
                <div>
                    <div class="student-name">${student.name}</div>
                    <div class="student-id">🆔 ${student.studentId}</div>
                </div>
                <div class="student-status">
                    ${student.confirmed ? '✅' : '⏳'}
                </div>
            </div>
        `;
    }).join('');

    document.getElementById('presentCount').textContent = present;
    document.getElementById('pendingCount').textContent = pending;
    document.getElementById('absentCount').textContent = pending;
    document.getElementById('totalStudents').textContent = students.length;
}

// تأكيد حضور طالب
window.toggleConfirm = async function(id) {
    const student = studentsData[id];
    if (!student) return;

    const newStatus = !student.confirmed;
    await update(ref(db, `currentSession/students/${id}`), {
        confirmed: newStatus
    });
};

// تصدير Excel
window.exportToCSV = function() {
    const students = Object.entries(studentsData);
    if (students.length === 0) {
        alert('لا يوجد بيانات للتصدير');
        return;
    }

    let csv = 'الاسم,الكود,الحالة,الوقت\n';
    students.forEach(([id, s]) => {
        const status = s.confirmed ? 'حاضر' : 'بانتظار التأكيد';
        const time = s.timestamp ? new Date(s.timestamp).toLocaleTimeString('ar-EG') : '-';
        csv += `"${s.name}","${s.studentId}","${status}","${time}"\n`;
    });

    // BOM للعربية
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `attendance_${new Date().toISOString().slice(0, 10)}.csv`;
    link.click();
};
</script>
</body>
</html>
